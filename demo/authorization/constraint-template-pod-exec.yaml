apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8spodexecpolicy
  annotations:
    metadata.gatekeeper.sh/title: "Pod Exec Authorization Policy"
    metadata.gatekeeper.sh/version: 1.0.0
spec:
  crd:
    spec:
      names:
        kind: K8sPodExecPolicy
      validation:
        openAPIV3Schema:
          type: object
          properties:
            allowedNamespaces:
              type: array
              items:
                type: string
              description: Namespaces where pod exec is allowed
            deniedNamespaces:
              type: array
              items:
                type: string
              description: Namespaces where pod exec is denied
            users:
              type: array
              items:
                type: string
              description: Users this policy applies to
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8spodexecpolicy

        # This policy controls pod exec operations per namespace for specific users

        # Deny exec in denied namespaces for specified users
        violation[{"msg": msg}] {
          # Check if this is a pod exec request (subresource is "exec")
          input.review.resourceAttributes.subresource == "exec"
          input.review.resourceAttributes.resource == "pods"

          # Check if user is in the list of users this policy applies to
          user := input.review.user
          input.parameters.users[_] == user

          # Check if namespace is in denied list
          namespace := input.review.resourceAttributes.namespace
          denied_ns := input.parameters.deniedNamespaces[_]
          namespace == denied_ns

          msg := sprintf("User '%v' is not allowed to exec into pods in namespace '%v'", [user, namespace])
        }

        # Deny exec in namespaces NOT in allowed list (if allowedNamespaces is specified)
        violation[{"msg": msg}] {
          # Check if this is a pod exec request
          input.review.resourceAttributes.subresource == "exec"
          input.review.resourceAttributes.resource == "pods"

          # Check if user is in the list of users this policy applies to
          user := input.review.user
          input.parameters.users[_] == user

          # Only apply this rule if allowedNamespaces is specified and non-empty
          count(input.parameters.allowedNamespaces) > 0

          # Check if namespace is NOT in allowed list
          namespace := input.review.resourceAttributes.namespace
          not namespace_allowed(namespace)

          msg := sprintf("User '%v' is only allowed to exec into pods in namespaces: %v", [user, input.parameters.allowedNamespaces])
        }

        namespace_allowed(ns) {
          input.parameters.allowedNamespaces[_] == ns
        }
