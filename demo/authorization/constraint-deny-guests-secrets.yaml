apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sAuthorizationPolicy
metadata:
  name: deny-guests-secrets
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Secret"]
  parameters:
    deniedGroups:
      - "guests"
      - "unauthenticated"
    deniedVerbs:
      - "get"
      - "list"
      - "watch"
      - "delete"
    deniedResources:
      - "secrets"
    exemptGroups:
      - "system:masters"
      - "admins"
