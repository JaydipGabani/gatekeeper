# Secret Access Restriction
# Only Security team can manage secrets in production/sensitive namespaces
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sAzureADAuthorization
metadata:
  name: secrets-security-team-only
  annotations:
    description: "Restrict secret management to security team"
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Secret"]
    operations: ["CREATE", "UPDATE", "DELETE"]
    namespaces:
      - "production"
      - "sensitive-data"
      - "secrets-store"
    excludedNamespaces:
      - "kube-system"
      - "gatekeeper-system"
  parameters:
    # Replace with your actual Security Team group Object ID
    requiredGroupIDs:
      - "00000000-0000-0000-0000-000000000001"
    allowedDepartments:
      - "Security"
      - "Platform Engineering"
      - "Compliance"
    denyDisabledAccounts: true
    allowServiceAccounts: true
    message: "Secret management in production requires Security team membership."
