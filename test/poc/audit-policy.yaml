# Audit policy to capture userInfo for debugging
apiVersion: audit.k8s.io/v1
kind: Policy
rules:
  # Log all requests at the Metadata level (includes userInfo)
  - level: Metadata
    resources:
    - group: ""
      resources: ["namespaces", "secrets", "configmaps"]
    - group: "apps"
      resources: ["deployments", "statefulsets", "daemonsets"]
  
  # Log request/response for namespace operations (more detail)
  - level: RequestResponse
    resources:
    - group: ""
      resources: ["namespaces"]
    verbs: ["create", "delete", "update", "patch"]
  
  # Skip logging for frequent read-only requests
  - level: None
    users: ["system:kube-proxy"]
    verbs: ["watch"]
    resources:
    - group: ""
      resources: ["endpoints", "services", "services/status"]
  
  # Skip logging for kubelet health checks
  - level: None
    userGroups: ["system:nodes"]
    verbs: ["get"]
    resources:
    - group: ""
      resources: ["nodes", "nodes/status"]
  
  # Default: log at Metadata level
  - level: Metadata
    omitStages:
    - "RequestReceived"
