# Example: Restrict who can create/modify Secrets
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sUserAuthorization
metadata:
  name: restrict-secret-modification
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Secret"]
    operations: ["CREATE", "UPDATE", "DELETE"]
    namespaces:
      - production
      - staging
    excludedNamespaces:
      - kube-system
  parameters:
    allowedUsers:
      - "secrets-admin@example.com"
    allowedGroups:
      - "secrets-managers"
      - "platform-admins"
      - "system:masters"
    deniedUsers: []
    message: "Secret modifications in production/staging require secrets-manager role."
